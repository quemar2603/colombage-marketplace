<!-- @dsCard group="Components" viewport="700x420" name="Forms — input, switch, checkbox" subtitle="Large rounded fields & friendly toggles." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .glab { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Input, Switch, Checkbox } = window.ColombAgeDesignSystem_008fae;
    function Demo() {
      const [sms, setSms] = React.useState(true);
      const [mail, setMail] = React.useState(false);
      const [c1, setC1] = React.useState(true);
      const [c2, setC2] = React.useState(false);
      return (
        <div className="grid">
          <div>
            <div className="glab">Text fields</div>
            <div className="stack">
              <Input label="Votre nom" placeholder="Marie Lefèvre" defaultValue="Marie Lefèvre" />
              <Input label="Téléphone" placeholder="06 12 34 56 78" helper="Pour vous joindre facilement" />
              <Input label="Code postal" defaultValue="7500" error="Code postal incomplet" />
            </div>
          </div>
          <div>
            <div className="glab">Toggles & choices</div>
            <div className="stack">
              <Switch checked={sms} onChange={setSms} label="Rappels par SMS" />
              <Switch checked={mail} onChange={setMail} label="Newsletter mensuelle" />
              <Checkbox checked={c1} onChange={setC1} label="Aide aux courses" />
              <Checkbox checked={c2} onChange={setC2} label="Accompagnement médical" />
              <Checkbox checked={false} disabled label="Indisponible le dimanche" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
