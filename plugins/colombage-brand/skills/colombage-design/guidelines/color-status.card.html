<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Gentle, on-brand success / warning / danger pairs." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; }
  .item { flex: 1; border-radius: var(--radius-md); padding: 12px 14px;
          display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .dot { width: 22px; height: 22px; border-radius: 999px; flex: none; }
</style>
</head>
<body>
  <div class="row">
    <div class="item" style="background:var(--success-soft);color:var(--success)"><span class="dot" style="background:var(--success)"></span>Success</div>
    <div class="item" style="background:var(--warning-soft);color:var(--warning)"><span class="dot" style="background:var(--warning)"></span>Warning</div>
    <div class="item" style="background:var(--danger-soft);color:var(--danger)"><span class="dot" style="background:var(--danger)"></span>Danger</div>
  </div>
</body>
</html>
