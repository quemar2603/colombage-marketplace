<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Periwinkle (secondary)" subtitle="Calm blue for info surfaces & supporting elements." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px 10px; height: 96px;
        display: flex; flex-direction: column; justify-content: flex-end;
        font-size: 12px; color: var(--navy-700); border: 1px solid rgba(48,73,105,.08); }
  .hex { opacity: .8; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--peri-100)"><span>peri-100</span><span class="hex">#F0F2FB</span></div>
    <div class="sw" style="background:var(--peri-200)"><span>peri-200</span><span class="hex">#E0E4F7</span></div>
    <div class="sw" style="background:var(--peri-300)"><span>peri-300</span><span class="hex">#CCD3F1</span></div>
    <div class="sw" style="background:var(--peri-400);outline:3px solid var(--navy-600);outline-offset:2px"><span>peri-400 ★</span><span class="hex">#B8C1EC</span></div>
    <div class="sw" style="background:var(--peri-600)"><span>peri-600</span><span class="hex">#8F9DCE</span></div>
  </div>
</body>
</html>
