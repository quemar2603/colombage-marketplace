<!-- @dsCard group="Type" viewport="700x260" name="Display scale" subtitle="Headings — xl through 4xl, tight leading." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); color: var(--text-strong); }
  .line { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
  .label { font-size: 12px; color: var(--text-muted); width: 70px; flex: none; }
  .s { letter-spacing: -0.01em; line-height: 1.1; }
</style>
</head>
<body>
  <div class="line"><span class="label">4xl · 60</span><span class="s" style="font-size:60px">Bonjour</span></div>
  <div class="line"><span class="label">3xl · 48</span><span class="s" style="font-size:48px">Bien chez soi</span></div>
  <div class="line"><span class="label">2xl · 38</span><span class="s" style="font-size:38px">Une présence rassurante</span></div>
  <div class="line"><span class="label">xl · 30</span><span class="s" style="font-size:30px">Des services à domicile</span></div>
</body>
</html>
