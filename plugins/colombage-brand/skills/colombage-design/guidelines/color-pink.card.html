<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Pink (accent)" subtitle="Soft pink for small separators, tags & warm highlights." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px 10px; height: 96px;
        display: flex; flex-direction: column; justify-content: flex-end;
        font-size: 12px; color: var(--navy-700); border: 1px solid rgba(48,73,105,.08); }
  .hex { opacity: .8; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--pink-100)"><span>pink-100</span><span class="hex">#FCEFF1</span></div>
    <div class="sw" style="background:var(--pink-200)"><span>pink-200</span><span class="hex">#F8DFE3</span></div>
    <div class="sw" style="background:var(--pink-300)"><span>pink-300</span><span class="hex">#F3CDD3</span></div>
    <div class="sw" style="background:var(--pink-400);outline:3px solid var(--navy-600);outline-offset:2px"><span>pink-400 ★</span><span class="hex">#EEBBC3</span></div>
    <div class="sw" style="background:var(--pink-600)"><span>pink-600</span><span class="hex">#D98A99</span></div>
  </div>
</body>
</html>
