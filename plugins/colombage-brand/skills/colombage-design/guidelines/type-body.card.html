<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); color: var(--text-body); }
  .eyebrow { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .lg { font-size: 24px; color: var(--text-strong); margin-bottom: 8px; }
  .base { font-size: 18px; line-height: 1.7; max-width: 560px; }
  .sm { font-size: 15px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="eyebrow">Accompagnement</div>
  <div class="lg">Un quotidien plus serein, à la maison.</div>
  <div class="base">Nos auxiliaires de vie passent vous voir, partagent un moment, et veillent sur ce qui compte. Tout est pensé pour rester simple et chaleureux.</div>
  <div class="sm">Texte secondaire · 15px muted</div>
</body>
</html>
