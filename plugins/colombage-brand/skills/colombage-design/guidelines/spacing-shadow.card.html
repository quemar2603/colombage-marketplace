<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation / shadows" subtitle="Soft navy-tinted shadows. Pink glow for accents." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px 24px; background: var(--surface-page); }
  .row { display: flex; gap: 26px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 64px; background: var(--white); border-radius: var(--radius-lg); }
  .lab { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-accent);background:var(--pink-400)"></div><div class="lab">accent glow</div></div>
  </div>
</body>
</html>
