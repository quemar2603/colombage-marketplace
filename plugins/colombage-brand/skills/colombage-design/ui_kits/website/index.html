<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ColombAge — Bien chez soi</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  a:hover { color: var(--navy-600); text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="image-slot.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel">
    function Site() {
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons({ nameAttr: 'data-lucide' }); });
      return (
        <React.Fragment>
          <Header />
          <Hero />
          <Services />
          <HowItWorks />
          <Testimonial />
          <FooterCTA />
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
    setTimeout(() => window.lucide && window.lucide.createIcons({ nameAttr: 'data-lucide' }), 300);
  </script>
</body>
</html>
