<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ColombAge — App</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--peri-100); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .phone {
    width: 390px; height: 800px; background: var(--surface-page);
    border-radius: 46px; border: 10px solid var(--navy-800);
    box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
    position: relative;
  }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px 6px; font-size: 15px; color: var(--navy-700); flex: none;
  }
  .screen { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
  .screen::-webkit-scrollbar { width: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
